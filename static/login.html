<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FloodGuard AI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/splash.js"></script>
</head>
<body class="flex-center" style="min-height: 100vh; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 40px 32px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <a href="/" class="logo-brand" style="justify-content: center; margin-bottom: 16px;">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                <div class="logo-text">FloodGuard <span>AI</span></div>
            </a>
            <div class="ai-badge" style="margin-top: 4px;">
                <span class="ai-badge-pulse"></span>
                IA de Proteção Vital
            </div>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 12px;">Acesse a plataforma preditiva de monitoramento</p>
        </div>

        <form id="loginForm">
            <div style="margin-bottom: 20px;">
                <label style="font-size: 14px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 8px;">E-mail do Usuário</label>
                <input type="email" id="email" class="input" value="admin@floodguard.ai" required placeholder="seu@email.com">
            </div>
            <div style="margin-bottom: 28px;">
                <label style="font-size: 14px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 8px;">Senha de Acesso</label>
                <input type="password" id="senha" class="input" value="admin123" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">
                🚀 Entrar no Sistema
            </button>
            <p id="errorMsg" style="color: var(--danger); margin-top: 16px; text-align: center; font-weight: 600; font-size: 14px;"></p>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 20px;">
            <a href="/" style="color: var(--accent-cyan); text-decoration: none; font-size: 14px; font-weight: 600;">← Voltar para a página inicial</a>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
