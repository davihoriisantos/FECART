<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - FloodGuard AI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="flex-center" style="height: 100vh; background: var(--surface);">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 24px;">FloodGuard AI</h2>
        <form id="loginForm">
            <div style="margin-bottom: 16px;">
                <label>Email</label>
                <input type="email" id="email" class="input" required>
            </div>
            <div style="margin-bottom: 24px;">
                <label>Senha</label>
                <input type="password" id="senha" class="input" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            <p id="errorMsg" style="color: var(--error); margin-top: 16px; text-align: center;"></p>
        </form>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
