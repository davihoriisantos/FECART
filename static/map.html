<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Risco - FloodGuard AI</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .map-overlay { 
            position: absolute; 
            z-index: 1000; 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); 
            border-radius: var(--radius-md); 
            box-shadow: var(--shadow-card); 
            padding: 16px 20px; 
            color: #FFFFFF;
        }
        .top-bar { 
            top: 20px; 
            left: 20px; 
            display: flex; 
            gap: 20px; 
            align-items: center; 
        }
        .legend { bottom: 24px; right: 24px; min-width: 200px; }
        .color-box { width: 14px; height: 14px; display: inline-block; margin-right: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="map-overlay top-bar">
        <a href="/" class="logo-brand" style="text-decoration: none;">
            <div class="logo-icon" style="width: 34px; height: 34px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div class="logo-text" style="font-size: 18px;">FloodGuard <span>AI</span></div>
        </a>

        <div class="ai-badge">
            <span class="ai-badge-pulse"></span>
            Monitoramento ao Vivo
        </div>

        <a href="/static/dashboard.html" class="btn btn-outline" style="padding: 8px 16px; font-size: 14px;">
            📊 Voltar ao Painel
        </a>
    </div>
    
    <div class="map-overlay legend">
        <h4 style="margin-bottom: 12px; font-size: 14px; font-weight: 700;">Níveis Preditivos de Risco</h4>
        <div style="margin-bottom: 6px; font-size: 13px;"><span class="color-box chip-baixo"></span> Baixo (Risco < 30%)</div>
        <div style="margin-bottom: 6px; font-size: 13px;"><span class="color-box chip-moderado"></span> Moderado (30% - 50%)</div>
        <div style="margin-bottom: 6px; font-size: 13px;"><span class="color-box chip-alto"></span> Alto (50% - 75%)</div>
        <div style="font-size: 13px;"><span class="color-box chip-critico"></span> Crítico (> 75%)</div>
    </div>

    <div id="map"></div>
    <div class="control-panel" style="position:fixed; bottom:20px; right:20px; z-index:1000; background:rgba(15,23,42,0.8); padding:10px; border-radius:8px; display:flex; gap:8px;">
       <button id="btn-enchente" class="btn" style="background:red;color:#fff;">Simular Enchente</button>
       <button id="btn-limpo" class="btn" style="background:green;color:#fff;">Simular Tempo Limpo</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/historico_defesa_civil.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
